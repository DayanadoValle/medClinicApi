version: '3.9'

services:
  # Serviço PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: medclinic-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-medclinic}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/sql/create_users_table.sql:/docker-entrypoint-initdb.d/create_users_table.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medclinic-network

  # Serviço da API MedClinic
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medclinic-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-medclinic}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      NODE_ENV: development
    ports:
      - "3000:3000"
    networks:
      - medclinic-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  medclinic-network:
    driver: bridge
